processes:
  packagist_updates:
    cmd: ['symfony', 'console', 'demo:packagist-updates', '-v']
    restart: always

  url_health:
    cmd: ['symfony', 'console', 'demo:http-head', '-v']
    restart: always

  debian_download:
    cmd: ['symfony', 'console', 'demo:debian-download', '-v']
    restart: always

  queue_worker:
    cmd: ['symfony', 'console', 'messenger:consume', 'async', '-v', '--time-limit=3600', '--memory-limit=512M']
    restart: never

  state_machine:
    cmd: ['symfony', 'console', 'demo:state-machine', '-v']
    restart: always

  oneshot:
    cmd: ['symfony', 'console', 'demo:oneshot', '-v']
    restart: never

  ticker:
    cmd: ['symfony', 'console', 'demo:ticker', '-v']
    restart: always

ring_buffer_lines: 5000
follow_by_default: true
